services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ADMIN
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: my_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bright_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
    driver: local

    # DATABASE_URL="postgresql://ADMIN:mypassword@localhost:5432/my_db"